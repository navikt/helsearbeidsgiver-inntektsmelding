metadata:
  name: im-api

spec:
  kafka:
    pool: nav-dev
  ingresses:
    - https://helsearbeidsgiver-im-api.intern.dev.nav.no
  idporten:
    enabled: true
    sidecar:
      enabled: true
  valkey:
    - instance: inntektsmelding
      access: read
  accessPolicy:
    inbound:
      rules:
        - application: spinntektsmelding-frontend
