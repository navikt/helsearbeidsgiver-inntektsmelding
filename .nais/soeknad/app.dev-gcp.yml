metadata:
  name: im-soeknad

spec:
  kafka:
    pool: nav-dev
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: sykepengesoknad-backend
          namespace: flex
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: helsearbeidsgiver-im-soeknad-v1
    - name: SOEKNAD_BASE_URL
      value: http://sykepengesoknad-backend.flex
    - name: SOEKNAD_SCOPE
      value: api://dev-gcp.flex.sykepengesoknad-backend/.default
