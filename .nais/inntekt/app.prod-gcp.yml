metadata:
  name: im-inntekt

spec:
  replicas:
    max: 5
    scalingStrategy:
      kafka:
        consumerGroup: helsearbeidsgiver-im-inntekt-v1
        topic: helsearbeidsgiver.rapid
        threshold: 100
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      external:
        - host: ikomp.prod-fss-pub.nais.io
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: helsearbeidsgiver-im-inntekt-v1
    - name: INNTEKT_URL
      value: https://ikomp.prod-fss-pub.nais.io/rs
    - name: INNTEKT_SCOPE
      value: api://prod-fss.team-inntekt.ikomp/.default
