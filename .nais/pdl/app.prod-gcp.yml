metadata:
  name: im-pdl

spec:
  replicas:
    max: 5
    scalingStrategy:
      kafka:
        consumerGroup: helsearbeidsgiver-im-pdl-v1
        topic: helsearbeidsgiver.rapid
        threshold: 100
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      external:
        - host: pdl-api.prod-fss-pub.nais.io
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: helsearbeidsgiver-im-pdl-v1
    - name: PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io/graphql
    - name: PDL_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
