metadata:
  name: im-feil-behandler

spec:
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_16
        tier: db-custom-1-3840
        databases:
          - name: im-error-recovery
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  envFrom:
    - secret: google-sql-im-feil-behandler
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: helsearbeidsgiver-im-feil-behandler-v1
