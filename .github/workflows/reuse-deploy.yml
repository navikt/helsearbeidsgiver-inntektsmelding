name: Deploy

on:
  workflow_call:
    inputs:
      deploy-matrix:
        required: true
        type: string

permissions:
  id-token: write

jobs:
  deploy:
    if: "!contains(inputs.deploy-matrix, '\"project\": []')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.deploy-matrix) }}
    concurrency:
      group: deploy-${{ matrix.cluster }}-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: Last ned Docker image-fil
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.project }}-image.txt

      - name: Les Docker image-fil
        id: docker-image
        run: echo "image=$(cat ${{ matrix.project }}-image.txt)" >> $GITHUB_OUTPUT

      - uses: nais/setup@v1
        with:
          team: helsearbeidsgiver

      - name: Deploy
        run: |
          nais apply .nais/app.yml \
            --environment ${{ matrix.cluster }} \
            --mixin .nais/${{ matrix.project }}/app.${{ matrix.cluster }}.yml \
            --set spec.image="${{ steps.docker-image.outputs.image }}" \
            --wait
